<div class="container mt-5 text-center">
  <h2>Select a Topic</h2>

  <div *ngIf="topics.length > 0; else loading">
    <button *ngFor="let topic of topics"
            (click)="openTopic(topic)"
            class="btn btn-primary m-2">
      {{ topic }}
    </button>
  </div>

  <ng-template #loading>
    <p>Loading topics...</p>
  </ng-template>
</div>
